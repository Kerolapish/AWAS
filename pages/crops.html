<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Management - AWAS</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/crop.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* CSS Modal/Form yang anda berikan sebelum ini */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            border-radius: 8px;
            width: 90%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            background-color: #2c7744;
            color: white;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close-button {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .crop-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .detail-group {
            margin-bottom: 1rem;
        }

        .detail-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #2c7744;
        }

        .detail-value {
            padding: 0.5rem;
            background-color: #f5f7fa;
            border-radius: 4px;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn {
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }

        .btn-primary:hover {
            background-color: #3d8b40;
        }

        .btn-secondary {
            background-color: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background-color: #d0d0d0;
        }

        .btn-danger {
            background-color: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background-color: #d32f2f;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #2c7744;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #ddd;
            margin-bottom: 1.5rem;
        }

        .tab {
            padding: 0.7rem 1.5rem;
            cursor: pointer;
            border-bottom: 3px solid transparent;
        }

        .tab.active {
            border-bottom: 3px solid #4CAF50;
            color: #4CAF50;
            font-weight: bold;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .notification {
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 4px;
            display: none;
        }

        .notification.success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .notification.error {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        .edit-form {
            display: none;
        }

        .edit-form.active {
            display: block;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #eee;
        }

        /* Image Preview (Dibuang) */
        .crop-image-preview {
            display: none;
        }

        .upload-btn-wrapper {
            display: none;
        }

        /* Tambahan CSS untuk grid card crops */
        .crop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .crop-card {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
            background-color: white;
            display: flex;
            flex-direction: column;
        }

        .card-content {
            padding: 15px;
        }

        .card-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 10px 0;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            display: block;
            font-size: 1.2rem;
            font-weight: bold;
            color: #2c7744;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
            margin-bottom: 10px;
        }

        .status-good {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .status-warn {
            background-color: #fff3e0;
            color: #ff9800;
        }
    </style>
</head>

<body>

    <header>
        <h1>Agricultural Weather Alert System (AWAS)</h1>
        <nav class="main-nav">
            <a href="index.html" class="nav-button active">Index</a>
            <a href="weather.html" class="nav-button">Weather</a>
            <a href="crops.html" class="nav-button active">Crop</a>
            <a href="ledger.html" class="nav-button">Ledger</a>
        </nav>
    </header>

    <main class="crop-page-container">

        <div class="crop-header">
            <h2>Your Crops</h2>
            <button class="add-new-button" id="btn-add-new-crop">+ Add New Crop</button>
        </div>

        <div class="crop-grid" id="crop-grid">
            <p id="loading-message" style="text-align: center; grid-column: 1 / -1;">Loading crops...</p>
        </div>
    </main>

    <div id="cropModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Manage Crop</h2>
                <button class="close-button">&times;</button>
            </div>
            <div class="modal-body">
                <div id="notification" class="notification"></div>

                <div class="tabs">
                    <div class="tab active" data-tab="details">Details</div>
                    <div class="tab" data-tab="actions">Actions</div>
                    <div class="tab" data-tab="history">History</div>
                    <button class="btn btn-danger" id="btn-delete-crop" style="margin-left: auto;">Delete Crop</button>
                </div>

                <div id="details-tab" class="tab-content active">
                    <div class="crop-details">
                    </div>

                    <div class="action-buttons">
                        <button class="btn btn-primary" id="btn-edit">Edit Details</button>
                        <button class="btn btn-secondary" id="btn-refresh">Refresh Data</button>
                    </div>
                </div>

                <form id="edit-form-data" class="edit-form">
                    <h3 style="margin-bottom: 1.5rem; color: #2c7744;">Edit Crop Details</h3>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="edit-crop-name">Crop Name</label>
                            <input type="text" id="edit-crop-name" name="crop_name" required>
                        </div>
                        <div class="form-group">
                            <label for="edit-crop-type">Crop Type</label>
                            <select id="edit-crop-type" name="crop_type">
                                <option value="vegetable">Vegetable</option>
                                <option value="fruit">Fruit</option>
                                <option value="grain">Grain</option>
                                <option value="herb">Herb</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="edit-field-location">Field Location</label>
                            <input type="text" id="edit-field-location" name="field_location" required>
                        </div>
                        <div class="form-group">
                            <label for="edit-planting-date">Planting Date</label>
                            <input type="date" id="edit-planting-date" name="planting_date" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="edit-health-status">Health Status (%)</label>
                            <input type="number" id="edit-health-status" name="health_status" min="0" max="100"
                                required>
                        </div>
                        <div class="form-group">
                            <label for="edit-soil-moisture">Soil Moisture (%)</label>
                            <input type="number" id="edit-soil-moisture" name="soil_moisture" min="0" max="100"
                                required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="edit-last-watered">Last Watered</label>
                            <input type="date" id="edit-last-watered" name="last_watered" required>
                        </div>
                        <div class="form-group">
                            <label for="edit-next-fertilization">Next Fertilization</label>
                            <input type="date" id="edit-next-fertilization" name="next_fertilization" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="edit-notes">Additional Notes</label>
                        <textarea id="edit-notes" name="notes"
                            placeholder="Add any additional notes about this crop..."></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="btn-cancel-edit">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>

                <div id="actions-tab" class="tab-content">
                    <form id="action-form">
                        <div class="form-group">
                            <label for="action-type">Action Type</label>
                            <select id="action-type" name="action_type">
                                <option value="">Select an action</option>
                                <option value="water">Water Crop</option>
                                <option value="fertilize">Apply Fertilizer</option>
                                <option value="pesticide">Apply Pesticide</option>
                                <option value="harvest">Harvest</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <div class="form-group" id="action-details-group">
                            <label for="action-notes">Notes</label>
                            <textarea id="action-notes" name="action_notes"
                                placeholder="Add any relevant notes about this action..."></textarea>
                        </div>

                        <div class="action-buttons">
                            <button type="submit" class="btn btn-primary">Log Action</button>
                        </div>
                    </form>
                </div>

                <div id="history-tab" class="tab-content">
                    <div id="history-list">
                        <p style="text-align: center;">Loading history...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="addCropModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Crop</h2>
                <button class="close-button" id="close-add-crop">&times;</button>
            </div>
            <div class="modal-body">
                <div id="add-crop-notification" class="notification"></div>

                <form id="add-crop-form">

                    <div class="form-row">
                        <div class="form-group">
                            <label for="add-crop-name">Crop Name *</label>
                            <input type="text" id="add-crop-name" name="crop_name" required
                                placeholder="e.g., Tomato - Field C">
                        </div>
                        <div class="form-group">
                            <label for="add-crop-type">Crop Type *</label>
                            <select id="add-crop-type" name="crop_type" required>
                                <option value="">Select crop type</option>
                                <option value="vegetable">Vegetable</option>
                                <option value="fruit">Fruit</option>
                                <option value="grain">Grain</option>
                                <option value="herb">Herb</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="add-field-location">Field Location *</label>
                            <input type="text" id="add-field-location" name="field_location" required
                                placeholder="e.g., Field C, Greenhouse 2">
                        </div>
                        <div class="form-group">
                            <label for="add-planting-date">Planting Date *</label>
                            <input type="date" id="add-planting-date" name="planting_date" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="add-health-status">Initial Health Status (%) *</label>
                            <input type="number" id="add-health-status" name="health_status" min="0" max="100"
                                value="95" required>
                        </div>
                        <div class="form-group">
                            <label for="add-soil-moisture">Initial Soil Moisture (%) *</label>
                            <input type="number" id="add-soil-moisture" name="soil_moisture" min="0" max="100"
                                value="70" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="add-notes">Initial Notes</label>
                        <textarea id="add-notes" name="notes"
                            placeholder="Add any initial notes about this crop..."></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="btn-cancel-add">Cancel</button>
                        <button type="submit" class="btn btn-primary">Add Crop</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

     
   <script>
    // PENTING: Laluan API
    const API_PATH = '../api/api.php';
    
    // --- UTILITY FUNCTIONS ---
    function calculateDaysOld(plantingDateStr) {
        const plantingDate = new Date(plantingDateStr);
        const today = new Date();
        const diffTime = Math.abs(today - plantingDate);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        return diffDays;
    }

    function showNotification(message, type) {
        const notification = document.getElementById('notification');
        if (notification) { 
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.style.display = 'block';
            setTimeout(() => { notification.style.display = 'none'; }, 3000);
        }
    }
    
    function showAddCropNotification(message, type) {
        const notification = document.getElementById('add-crop-notification');
        if (notification) { 
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.style.display = 'block';
            setTimeout(() => { notification.style.display = 'none'; }, 3000);
        }
    }

    // FUNGSI BARU (REFRESH) - INI ADALAH FUNGSI YANG HILANG DAN KINI WUJUD
    function refreshCropData() {
        if (currentCropId) {
            showNotification('Data refreshed from server.', 'success');
            openCropModal(currentCropId); // Muat semula modal
        }
    }

    function populateHistory(history) {
        const historyList = document.getElementById('history-list');
        historyList.innerHTML = '';
        
        if (history.length === 0) {
            historyList.innerHTML = '<p style="text-align: center;">No history available for this crop.</p>';
            return;
        }
        
        history.forEach(item => {
            const historyItem = document.createElement('div');
            historyItem.className = 'detail-group';
            historyItem.innerHTML = `
                <div style="display: flex; justify-content: space-between;">
                    <span><strong>${item.action_type.toUpperCase()}</strong></span>
                    <span>${item.action_date.split(' ')[0]}</span>
                </div>
                <div class="detail-value" style="margin-top: 0.5rem;">${item.action_notes || 'No notes.'}</div>
            `;
            historyList.appendChild(historyItem);
        });
    }

    // --- DOM ELEMENTS & INITIAL SETUP ---
    const modal = document.getElementById('cropModal');
    const addCropModal = document.getElementById('addCropModal');

    let currentCropId = null;
    const modalBodyOriginalContent = document.getElementById('cropModal').querySelector('.modal-body').innerHTML;


    // --- FETCH DATA AND RENDER ---
    
    async function loadCrops() {
        const cropGrid = document.getElementById('crop-grid');
        const loadingMessage = document.getElementById('loading-message');
        if (loadingMessage) loadingMessage.style.display = 'block';
        
        try {
            const response = await fetch(`${API_PATH}?action=get_user_crops`);
            const data = await response.json();
            
            if (loadingMessage) loadingMessage.style.display = 'none';
            cropGrid.innerHTML = '';
            
            if (data.success && data.crops.length > 0) {
                data.crops.forEach(crop => {
                    createCropCard(crop);
                });
            } else if (data.success) {
                cropGrid.innerHTML = '<p style="text-align: center; grid-column: 1 / -1;">No crops added yet. Click "+ Add New Crop" to start.</p>';
            } else {
                cropGrid.innerHTML = `<p class="notification error" style="grid-column: 1 / -1; display: block;">Error loading crops: ${data.message}</p>`;
            }
        } catch (error) {
            if (loadingMessage) loadingMessage.style.display = 'none';
            cropGrid.innerHTML = `<p class="notification error" style="grid-column: 1 / -1; display: block;">Network Error: Cannot connect to PHP API. ${error.message}</p>`;
        }
    }
    
    function createCropCard(crop) {
        const cropGrid = document.getElementById('crop-grid');
        const daysOld = calculateDaysOld(crop.planting_date);
        const healthValue = parseInt(crop.health_status);
        
        let statusClass = 'status-good';
        let statusText = 'Good';
        
        if (healthValue < 70) {
            statusClass = 'status-warn';
            statusText = 'Poor';
        } else if (healthValue < 90) {
            statusClass = 'status-warn';
            statusText = 'Warning';
        }

        const cropCard = document.createElement('article');
        cropCard.className = 'crop-card';
        cropCard.innerHTML = `
            <div class="card-img-placeholder">
                <span>${crop.crop_type}</span>
            </div>
            <div class="card-content">
                <h3>${crop.crop_name}</h3>
                <span class="status-badge ${statusClass}">${statusText}</span>
                
                <div class="card-stats">
                    <div class="stat-item">
                        <span class="stat-number">${daysOld}</span>
                        <span class="stat-label">Days Old</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">${crop.health_status}%</span>
                        <span class="stat-label">Health</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">${crop.soil_moisture}%</span>
                        <span class="stat-label">Moisture</span>
                    </div>
                </div>
                
                <a href="#" class="btn-manage" data-crop-id="${crop.id}">Manage</a>
            </div>
        `;
        
        cropGrid.appendChild(cropCard);
        
        cropCard.querySelector('.btn-manage').addEventListener('click', function(e) {
            e.preventDefault();
            openCropModal(this.getAttribute('data-crop-id'));
        });
    }
    
    // --- MODAL & FORM LOGIC ---

    async function openCropModal(cropId) {
        currentCropId = cropId;
        modal.style.display = 'flex';
        modal.querySelector('.modal-body').style.opacity = 0.5; 
        
        try {
            // Permintaan PHP untuk mendapatkan butiran tanaman dan sejarah
            const response = await fetch(`${API_PATH}?action=get_crop_details&crop_id=${cropId}`);
            const data = await response.json();

            // Sediakan modal body untuk dimasukkan semula
            modal.querySelector('.modal-body').innerHTML = modalBodyOriginalContent;

            if (data.success) {
                modal.querySelector('.modal-body').style.opacity = 1;
                
                fillDetailsTab(data.crop);
                populateHistory(data.history); 
                setupEditForm(data.crop);
                
                rebindModalEvents(); // Rebind events ke elemen baru

            } else {
                modal.querySelector('.modal-body').innerHTML = `<p class="notification error" style="display: block;">Error: ${data.message}</p>`;
            }
        } catch (error) {
            modal.querySelector('.modal-body').innerHTML = `<p class="notification error" style="display: block;">Network Error: Failed to fetch crop details. (${error.message})</p>`;
        }
    }
    
    function rebindModalEvents() {
        // --- RE-BINDING KRITIKAL (Safety Checks added) ---
        
        // Modal Close Button
        const closeBtn = modal.querySelector('.close-button');
        if (closeBtn) closeBtn.addEventListener('click', () => modal.style.display = 'none');

        // Delete Button
        const deleteBtn = document.getElementById('btn-delete-crop');
        if (deleteBtn) deleteBtn.addEventListener('click', deleteCrop);
        
        // Tab Switching
        document.querySelectorAll('#cropModal .tab').forEach(tab => {
            tab.addEventListener('click', function() {
                const tabId = this.getAttribute('data-tab');
                document.querySelectorAll('#cropModal .tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                document.getElementById(`${tabId}-tab`).classList.add('active');

                if (tabId === 'history') {
                    loadCropHistory(currentCropId);
                }
            });
        });

        // Form Actions
        const editForm = document.getElementById('edit-form-data');
        const actionForm = document.getElementById('action-form');
        const actionTypeSelect = document.getElementById('action-type');

        if (document.getElementById('btn-edit')) document.getElementById('btn-edit').addEventListener('click', showEditForm);
        if (document.getElementById('btn-cancel-edit')) document.getElementById('btn-cancel-edit').addEventListener('click', hideEditForm);
        if (document.getElementById('btn-refresh')) document.getElementById('btn-refresh').addEventListener('click', refreshCropData); 
        if (editForm) editForm.addEventListener('submit', saveCropChanges);
        if (actionForm) actionForm.addEventListener('submit', logAction);
        
        // Action Form Logic (Notes field visibility)
        if (actionTypeSelect) {
            actionTypeSelect.addEventListener('change', function() {
                const actionDetailsGroup = document.getElementById('action-details-group');
                if (actionDetailsGroup) actionDetailsGroup.style.display = this.value ? 'block' : 'none';
            });
        }
    }

    function fillDetailsTab(crop) {
        const daysOld = calculateDaysOld(crop.planting_date);
        const detailsHtml = `
            <div class="detail-group"><label>Crop Name</label><div class="detail-value">${crop.crop_name}</div></div>
            <div class="detail-group"><label>Field Location</label><div class="detail-value">${crop.field_location}</div></div>
            <div class="detail-group"><label>Crop Type</label><div class="detail-value">${crop.crop_type}</div></div>
            <div class="detail-group"><label>Days Old</label><div class="detail-value">${daysOld} days</div></div>
            <div class="detail-group"><label>Health Status</label><div class="detail-value">${crop.health_status}%</div></div>
            <div class="detail-group"><label>Soil Moisture</label><div class="detail-value">${crop.soil_moisture}%</div></div>
            <div class="detail-group"><label>Last Watered</label><div class="detail-value">${crop.last_watered}</div></div>
            <div class="detail-group"><label>Next Fertilization</label><div class="detail-value">${crop.next_fertilization}</div></div>
            <div class="detail-group" style="grid-column: 1 / -1;"><label>Notes</label><div class="detail-value">${crop.notes || 'No notes.'}</div></div>
        `;
        modal.querySelector('.crop-details').innerHTML = detailsHtml;
        document.getElementById('modal-title').textContent = `Manage: ${crop.crop_name}`;
    }
    
    function setupEditForm(crop) {
        document.getElementById('edit-crop-name').value = crop.crop_name;
        document.getElementById('edit-crop-type').value = crop.crop_type;
        document.getElementById('edit-field-location').value = crop.field_location;
        document.getElementById('edit-planting-date').value = crop.planting_date;
        document.getElementById('edit-health-status').value = crop.health_status;
        document.getElementById('edit-soil-moisture').value = crop.soil_moisture;
        document.getElementById('edit-last-watered').value = crop.last_watered;
        document.getElementById('edit-next-fertilization').value = crop.next_fertilization;
        document.getElementById('edit-notes').value = crop.notes || '';
    }
    
    function showEditForm() {
        modal.querySelector('.crop-details').style.display = 'none';
        modal.querySelector('.action-buttons').style.display = 'none';
        document.getElementById('edit-form-data').classList.add('active');
    }

    function hideEditForm() {
        modal.querySelector('.crop-details').style.display = 'grid';
        modal.querySelector('.action-buttons').style.display = 'flex';
        document.getElementById('edit-form-data').classList.remove('active');
    }
    
    // --- SUBMISSION HANDLERS (Kekal sama) ---
    async function saveCropChanges(e) {
        e.preventDefault();
        const cropId = currentCropId;
        const formData = new FormData(e.target);
        formData.append('crop_id', cropId);
        formData.append('action', 'update_crop');

        try {
             const response = await fetch(API_PATH, { method: 'POST', body: formData });
             const data = await response.json();
            
            if (data.success) {
                showNotification('Crop details updated successfully!', 'success');
                hideEditForm();
                loadCrops();
                setTimeout(() => openCropModal(cropId), 500);
            } else {
                showNotification(data.message || 'Error updating crop', 'error');
            }
        } catch (error) {
            showNotification('Network Error: Could not connect to API.', 'error');
        }
    }

    async function logAction(e) {
        e.preventDefault();
        const actionType = document.getElementById('action-type').value;
        
        if (!actionType) { showNotification('Please select an action type.', 'error'); return; }

        const formData = new FormData(e.target);
        formData.append('crop_id', currentCropId);
        formData.append('action', 'log_crop_action');
        
        try {
            const response = await fetch(API_PATH, { method: 'POST', body: formData });
            const data = await response.json();
            
            if (data.success) {
                showNotification(`Action: ${actionType} logged successfully!`, 'success');
                e.target.reset();
                setTimeout(() => openCropModal(currentCropId), 500);
            } else {
                showNotification(data.message || 'Error logging action', 'error');
            }
        } catch (error) {
            showNotification('Network Error: Could not connect to API.', 'error');
        }
    }
    
    async function deleteCrop() {
        if (!confirm(`Are you sure you want to delete this crop and all its history?`)) return;

        try {
            const response = await fetch(`${API_PATH}?action=delete_crop&crop_id=${currentCropId}`, { method: 'POST', });
            const data = await response.json();
            
            if (data.success) {
                showNotification('Crop deleted successfully!', 'success');
                modal.style.display = 'none';
                loadCrops();
            } else {
                showNotification(data.message || 'Error deleting crop', 'error');
            }
        } catch (error) {
            showNotification('Network Error: Could not connect to API.', 'error');
        }
    }

    async function loadCropHistory(cropId) {
        document.getElementById('history-list').innerHTML = '<p style="text-align: center;">Loading history...</p>';
        try {
             const result = await fetch(`${API_PATH}?action=get_crop_details&crop_id=${cropId}`);
             const data = await result.json();
             
             const historyList = document.getElementById('history-list');

             if (data.success && data.history.length > 0) {
                 historyList.innerHTML = '';
                 data.history.forEach(item => {
                     const historyItem = document.createElement('div');
                     historyItem.className = 'detail-group';
                     historyItem.innerHTML = `
                         <div style="display: flex; justify-content: space-between;">
                             <span><strong>${item.action_type.toUpperCase()}</strong></span>
                             <span>${item.action_date.split(' ')[0]}</span>
                         </div>
                         <div class="detail-value" style="margin-top: 0.5rem;">${item.action_notes || 'No notes.'}</div>
                     `;
                     historyList.appendChild(historyItem);
                 });
             } else {
                historyList.innerHTML = '<p style="text-align: center;">No history available for this crop.</p>';
             }
        } catch (error) {
            document.getElementById('history-list').innerHTML = '<p class="notification error">Failed to load history.</p>';
        }
    }

    async function addNewCrop(e) {
        e.preventDefault();
        const formData = new FormData(e.target);
        formData.append('action', 'add_new_crop');
        
        const plantingDate = document.getElementById('add-planting-date').value;
        formData.append('last_watered', plantingDate);

        try {
            const response = await fetch(API_PATH, { method: 'POST', body: formData });
            const data = await response.json();
            
            if (data.success) {
                showAddCropNotification('New crop added successfully!', 'success');
                addCropModal.style.display = 'none';
                loadCrops();
            } else {
                showAddCropNotification(data.message || 'Error adding crop', 'error');
            }
        } catch (error) {
            showAddCropNotification('Network Error: Could not connect to API.', 'error');
        }
    }
    
    // --- INIT ---
    document.addEventListener('DOMContentLoaded', loadCrops);

    // BINDINGS
    document.getElementById('btn-add-new-crop').addEventListener('click', () => {
        document.getElementById('add-planting-date').valueAsDate = new Date();
        addCropModal.style.display = 'flex';
    });
    document.getElementById('close-add-crop').addEventListener('click', () => addCropModal.style.display = 'none');
    document.getElementById('btn-cancel-add').addEventListener('click', () => addCropModal.style.display = 'none');
    document.getElementById('add-crop-form').addEventListener('submit', addNewCrop);
</script>
</body>

</html>
