<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Transaction - AWAS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/form_page.css">
</head>
<body>

    <header>
        <h1>Agricultural Weather Alert System (AWAS)</h1>
        <nav class="main-nav">
            <a href="./index.html" class="nav-button">Weather</a>
            <a href="./crops.html" class="nav-button">Crop</a>
            <a href="./weather.html" class="nav-button active">Ledger</a>
        </nav>
    </header>

    <main class="form-container">
        <section class="card">
            <h2>Add New Transaction</h2>
            <form id="transaction-form">
                
                <div class="form-group">
                    <label for="type">Transaction Type</label>
                    <select id="type" name="type" required>
                        <option value="expense">Expense (Cost)</option>
                        <option value="revenue">Revenue (Sale)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>
                </div>

                <div class="form-group">
                    <label for="crop">Related Crop</label>
                    <select id="crop" name="crop" required>
                        <option value="Chili Padi">Chili Padi</option>
                        <option value="Corn">Corn</option>
                        <option value="Lettuce">Lettuce</option>
                        <option value="General (Fertilizer, Labor, etc.)">General (Fertilizer, Labor, etc.)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="amount">Amount (RM)</label>
                    <input type="number" id="amount" name="amount" min="0" step="0.01" placeholder="150.00" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Save Transaction</button>
                    <a href="./ledger.html" class="btn-secondary">Cancel</a>
                </div>
            </form>
            <p id="form-message"></p>
        </section>
    </main>

    <script>
        const transactionForm = document.getElementById('transaction-form');
        const formMessage = document.getElementById('form-message');

        transactionForm.addEventListener('submit', function(event) {
            event.preventDefault(); // Stop the form from reloading the page
            
            formMessage.textContent = 'Saving...';
            formMessage.style.color = 'blue';

            const formData = new FormData(transactionForm);
            
            // Send the data to the PHP server file
            fetch('../api/save_transaction.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json()) // Expect a JSON response from PHP
            .then(data => {
                if (data.success) {
                    formMessage.textContent = 'Success! Redirecting...';
                    formMessage.style.color = 'green';
                    setTimeout(() => {
                        window.location.href = '../pages/ledger.html'; // Go back to the ledger
                    }, 1500);
                } else {
                    formMessage.textContent = 'Error: ' + data.error;
                    formMessage.style.color = 'red';
                }
            })
            .catch(error => {
                formMessage.textContent = 'Server or network error. Please try again.';
                formMessage.style.color = 'red';
            });
        });
    </script>

</body>
</html>
