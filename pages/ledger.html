<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Ledger - AWAS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/ledger.css"> </head>
<body>

    <header>
        <h1>Agricultural Weather Alert System (AWAS)</h1>
        <nav class="main-nav">
            <a href="./index.html" class="nav-button active">Index</a>
            <a href="./weather.html" class="nav-button">Weather</a>
            <a href="./crops.html" class="nav-button">Crop</a>
            <a href="./ledger.html" class="nav-button active">Ledger</a>
        </nav>
    </header>

    <main class="ledger-container">

        <div class="ledger-summary">
            <div class="summary-card">
                <h3>Total Revenue</h3>
                <span class="amount" id="total-revenue">RM 0.00</span>
            </div>
            <div class="summary-card">
                <h3>Total Expenses</h3>
                <span class="amount" id="total-expenses">RM 0.00</span>
            </div>
            <div class="summary-card">
                <h3>Net Profit / Loss</h3>
                <span class="amount" id="net-profit">RM 0.00</span>
            </div>
        </div>

        <div class="ledger-controls">
            <div class="control-group">
                <label for="crop-select">View Ledger For:</label>
                <select id="crop-select">
                    <option value="all">All Crops</option>
                    <option value="Chili Padi">Chili Padi</option>
                    <option value="Corn">Corn</option>
                    <option value="Lettuce">Lettuce</option>
                    <option value="General (Fertilizer, Labor, etc.)">General (Fertilizer, Labor, etc.)</option>
                </select>
            </div>
            <a href="./add_transaction.html" class="btn-primary">+ Add Transaction</a>
        </div>

        <section class="card">
            <h3>Transaction History</h3>
            <div class="table-responsive">
                <table class="ledger-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description (Crop)</th>
                            <th>Category</th>
                            <th class="text-right">Amount</th>
                            <th>Action</th> </tr>
                    </thead>
                    <tbody id="transaction-body">
                        </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const cropSelect = document.getElementById('crop-select');
            cropSelect.addEventListener('change', filterAndCalculate);
            loadLedgerData();
        });

        /**
         * Fetches data from the API and builds the table
         */
        function loadLedgerData() {
            const tableBody = document.getElementById('transaction-body');
            tableBody.innerHTML = '<tr><td colspan="5">Loading data...</td></tr>';

            // --- FIX 1: Correct API Path and Action ---
            // This now calls your real api.php file
            fetch('../api/api.php?action=get_ledger')
                .then(response => response.json())
                .then(data => {
                    tableBody.innerHTML = ''; // Clear loading message

                    // --- FIX 2: Check for API success and auth ---
                    // This matches the JSON response from your api.php file
                    if (!data.success) {
                        tableBody.innerHTML = `<tr><td colspan="5">Error: ${data.message}</td></tr>`;
                        if (data.auth === false) {
                            // If not logged in, redirect to login page
                            window.location.href = 'login.html';
                        }
                        return;
                    }

                    // --- FIX 3: Use the 'entries' array from your API ---
                    // This matches the JSON response from your api.php file
                    if (data.entries.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="5">No transactions found.</td></tr>';
                    }

                    data.entries.forEach(row => {
                        let amount = 0;
                        let categoryClass = '';
                        let amountClass = '';
                        let categoryText = '';

                        if (parseFloat(row.revenue) > 0) {
                            amount = parseFloat(row.revenue);
                            categoryClass = 'category-revenue';
                            amountClass = 'amount-revenue';
                            categoryText = 'Revenue';
                        } else {
                            amount = parseFloat(row.cost);
                            categoryClass = 'category-expense';
                            amountClass = 'amount-expense';
                            categoryText = 'Expense';
                        }
                        
                        let cropName = row.crop;

                        const newRow = `
                            <tr data-crop="${cropName}">
                                <td>${row.date}</td>
                                <td>${cropName}</td>
                                <td><span class="category-badge ${categoryClass}">${categoryText}</span></td>
                                <td class="${amountClass} text-right">RM ${amount.toFixed(2)}</td>
                                <td>
                                    <button class="delete-btn" data-id="${row.id}">&times;</button>
                                </td>
                            </tr>
                        `;
                        tableBody.innerHTML += newRow;
                    });

                    // --- NEW: Add click events to all delete buttons ---
                    document.querySelectorAll('.delete-btn').forEach(button => {
                        button.addEventListener('click', deleteEntry);
                    });

                    // After building the table, run the calculation
                    filterAndCalculate();
                })
                .catch(error => {
                    console.error('Fetch Error:', error);
                    // This is the error you are seeing
                    tableBody.innerHTML = '<tr><td colspan="5">Server or network error. Is XAMPP running?</td></tr>';
                });
        }

        /**
         * --- NEW FUNCTION: Deletes an entry ---
         */
        function deleteEntry(event) {
            const id = event.target.dataset.id;
            if (confirm('Are you sure you want to delete this entry?')) {
                // Call the 'delete_ledger' action in your api.php
                fetch(`../api/api.php?action=delete_ledger&id=${id}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            loadLedgerData(); // Reload the whole list and calculations
                        } else {
                            alert('Error: ' + data.message);
                        }
                    })
                    .catch(error => alert('Network error. Could not delete.'));
            }
        }

        /**
         * Filters the table and runs the calculation.
         */
        function filterAndCalculate() {
            const selectedCrop = document.getElementById('crop-select').value;
            const rows = document.querySelectorAll('#transaction-body tr');

            rows.forEach(row => {
                const rowCrop = row.dataset.crop;
                if (rowCrop) {
                    if (selectedCrop === 'all' || rowCrop === selectedCrop) {
                        row.style.display = '';
                    } else {
                        row.style.display = 'none';
                    }
                }
            });
            calculateLedger();
        }

        /**
         * Calculates the totals for the visible summary cards.
         */
        function calculateLedger() {
            let totalRevenue = 0;
            let totalExpenses = 0;
            const rows = document.querySelectorAll('#transaction-body tr');

            rows.forEach(row => {
                if (row.style.display !== 'none') {
                    const revenueCell = row.querySelector('.amount-revenue');
                    if (revenueCell) totalRevenue += parseAmount(revenueCell.textContent);
                    
                    const expenseCell = row.querySelector('.amount-expense');
                    if (expenseCell) totalExpenses += parseAmount(expenseCell.textContent);
                }
            });

            const netProfit = totalRevenue - totalExpenses;
            
            document.getElementById('total-revenue').textContent = formatCurrency(totalRevenue);
            document.getElementById('total-expenses').textContent = formatCurrency(totalExpenses);
            const netProfitElement = document.getElementById('net-profit');
            netProfitElement.textContent = formatCurrency(netProfit);

            netProfitElement.classList.remove('profit-positive', 'profit-negative');
            netProfitElement.classList.add(netProfit >= 0 ? 'profit-positive' : 'profit-negative');
        }

        // Helper functions
        function parseAmount(text) {
            return parseFloat(text.replace('RM', '').replace(/,/g, '').trim()) || 0;
        }

        function formatCurrency(number) {
            return new Intl.NumberFormat('ms-MY', {
                style: 'currency',
                currency: 'MYR'
            }).format(number);
        }
    </script>

</body>
</html>
